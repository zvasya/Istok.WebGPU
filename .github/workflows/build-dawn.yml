name: Build Dawn native libraries

on:
  workflow_dispatch:
  push:
    paths:
      - dawn-version.txt
      - native/dawn/**
      - .github/workflows/build-dawn.yml

permissions:
  contents: read

concurrency:
  group: build-dawn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, arch: arm64, runner: macos-15 }
          - { platform: macos, arch: x86_64, runner: macos-15 }
          - { platform: ios, arch: arm64, runner: macos-15 }
          - { platform: iossimulator, arch: arm64, runner: macos-15 }
          - { platform: iossimulator, arch: x86_64, runner: macos-15 }
          - { platform: android, arch: arm64-v8a, runner: ubuntu-24.04 }
          - { platform: android, arch: armeabi-v7a, runner: ubuntu-24.04 }
          - { platform: android, arch: x86, runner: ubuntu-24.04 }
          - { platform: android, arch: x86_64, runner: ubuntu-24.04 }
          - { platform: linux, arch: x64, runner: ubuntu-24.04 }
          - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { platform: windows, arch: x64, runner: windows-2022 }
          - { platform: windows, arch: x86, runner: windows-2022 }
          - { platform: windows, arch: arm64, runner: windows-2022 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CMake and Ninja
        run: python -m pip install cmake==3.31.10 ninja==1.11.1.4
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libx11-xcb-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxcb1-dev libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev mesa-common-dev libegl1-mesa-dev libvulkan-dev pkg-config
      - name: Install Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.0.13004108'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Build monolithic shared Dawn
        run: python native/dawn/build.py ${{ matrix.platform }} --arch ${{ matrix.arch }} --jobs 2 --no-copy-to-packages
      - name: Upload native library and headers
        uses: actions/upload-artifact@v4
        with:
          name: dawn-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/dawn/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error

  pull-request:
    name: Update native packages
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: dawn-*
          path: artifacts/dawn
      - name: Assemble runtime libraries
        shell: bash
        run: |
          for path in artifacts/dawn/dawn-*; do
            mv "$path" "artifacts/dawn/${path##*/dawn-}"
          done
          python native/dawn/package.py
          echo "DAWN_VERSION=$(tr -d '[:space:]' < dawn-version.txt)" >> "$GITHUB_ENV"
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: codex/update-dawn-native
          delete-branch: true
          commit-message: Update native Dawn libraries to ${{ env.DAWN_VERSION }}
          title: Update native Dawn libraries to ${{ env.DAWN_VERSION }}
          body: |
            Update the monolithic shared Dawn libraries to `${{ env.DAWN_VERSION }}` from `dawn-version.txt`.

            Includes macOS (universal), iOS, iOS simulator (universal), Android, Linux and Windows runtimes built by this workflow.
          add-paths: |
            Istok.WebGPU.Native.macOS/runtimes/
            Istok.WebGPU.Native.iOS/runtimes/
            Istok.WebGPU.Native.Android/runtimes/
            Istok.WebGPU.Native.Linux/runtimes/
            Istok.WebGPU.Native.Win32/runtimes/
