name: Publish to NuGet

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install .NET workloads
        run: dotnet workload install ios wasm-tools android --skip-manifest-update

      - name: Restore dependencies
        run: dotnet restore Istok.WebGPU.Packages.slnf

      - name: Build project
        run: dotnet build Istok.WebGPU.Packages.slnf --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack Istok.WebGPU.Packages.slnf --configuration Release --no-build --output artifacts/nuget

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push './artifacts/nuget/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
