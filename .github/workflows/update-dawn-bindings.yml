name: Update Dawn bindings

on:
  workflow_dispatch:
  push:
    paths:
      - global.json

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Read Dawn revision from the .NET Emscripten workload
        id: dawn
        shell: bash
        run: |
          sdk_version="$(dotnet --version)"
          sdk_dir="$(dotnet --list-sdks | awk -v version="$sdk_version" '$1 == version { gsub(/[\[\]]/, "", $2); print $2; exit }')"
          dotnet_root="$(dirname "$sdk_dir")"
          feature_band="$(sed -E 's/(-(preview|rc)\.[0-9]+)\..*/\1/' <<< "$sdk_version")"

          manifest="$(
            find "$dotnet_root/sdk-manifests/$feature_band/microsoft.net.workload.emscripten.current" \
              -name WorkloadManifest.json -type f \
              | sort -V \
              | tail -n 1
          )"
          pack_version="$(
            jq -r '.packs | to_entries[] | select(.key | test("^Microsoft.NET.Runtime.Emscripten.Sdk.net")) | .value.version' \
              "$manifest"
          )"
          port_file="$(
            find "$dotnet_root/packs" \
              -path "*/$pack_version/tools/emscripten/tools/ports/emdawnwebgpu.py" \
              -type f -print -quit
          )"

          dawn_revision="$(
            grep '^URL = ' "$port_file" \
              | grep -oE '[0-9a-f]{40}'
          )"
          emdawn_version="$(sed -nE "s/^_VERSION = '([^']+)'/\1/p" "$port_file")"

          if [[ ! "$dawn_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to find the Dawn revision in $port_file" >&2
            exit 1
          fi

          printf '%s\n' "$dawn_revision" > dawn-revision.txt
          echo "revision=$dawn_revision" >> "$GITHUB_OUTPUT"
          echo "emdawn-version=$emdawn_version" >> "$GITHUB_OUTPUT"

      - name: Download dawn.json
        shell: bash
        env:
          DAWN_REVISION: ${{ steps.dawn.outputs.revision }}
        run: |
          dawn_url="https://raw.githubusercontent.com/google/dawn/${DAWN_REVISION}/src/dawn/dawn.json"
          curl --fail --silent --show-error --location "$dawn_url" \
            --output Istok.WebGPU.LowLevel.Generator/codegen/dawn.json

          jq empty Istok.WebGPU.LowLevel.Generator/codegen/dawn.json

      - name: Generate code
        run: dotnet run --project Istok.WebGPU.LowLevel.Generator/Istok.WebGPU.LowLevel.Generator.csproj

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update Dawn bindings to ${{ steps.dawn.outputs.revision }}
          branch: automation/update-dawn-bindings
          delete-branch: true
          title: Update Dawn bindings to ${{ steps.dawn.outputs.revision }}
          body: |
            Generated WebGPU bindings for:

            - Emdawnwebgpu: `${{ steps.dawn.outputs.emdawn-version }}`
            - Dawn revision: `${{ steps.dawn.outputs.revision }}`
          add-paths: |
            dawn-revision.txt
            Istok.WebGPU.LowLevel.Generator/codegen/dawn.json
            Istok.WebGPU.LowLevel/Generated/
