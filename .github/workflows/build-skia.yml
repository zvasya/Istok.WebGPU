name: Build SkiaSharp native libraries

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-skia-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Validate build scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s native/dawn/tests -v
          python -m unittest discover -s native/skiasharp-dawn/tests -v

  build:
    needs: scripts
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, arch: arm64, runner: macos-15 }
          - { platform: macos, arch: x86_64, runner: macos-15 }
          - { platform: ios, arch: arm64, runner: macos-15 }
          - { platform: iossimulator, arch: arm64, runner: macos-15 }
          - { platform: iossimulator, arch: x86_64, runner: macos-15 }
          - { platform: android, arch: arm64-v8a, runner: ubuntu-24.04 }
          - { platform: android, arch: armeabi-v7a, runner: ubuntu-24.04 }
          - { platform: android, arch: x86, runner: ubuntu-24.04 }
          - { platform: android, arch: x86_64, runner: ubuntu-24.04 }
          - { platform: linux, arch: x64, runner: ubuntu-24.04, container: 'quay.io/pypa/manylinux_2_28_x86_64:latest' }
          - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm, container: 'quay.io/pypa/manylinux_2_28_aarch64:latest' }
          - { platform: windows, arch: x64, runner: windows-2022 }
          - { platform: windows, arch: x86, runner: windows-2022 }
          - { platform: windows, arch: arm64, runner: windows-2022 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        if: matrix.platform != 'linux'
        with:
          python-version: '3.12'
      - name: Select manylinux Python
        if: matrix.platform == 'linux'
        run: echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
      - name: Install CMake and Ninja
        run: python -m pip install cmake==3.31.10 ninja==1.11.1.4
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          dnf install -y mesa-libGL-devel mesa-libEGL-devel libxcb-devel libX11-devel libX11-xcb libXcursor-devel libXrandr-devel libXinerama-devel libXi-devel libXext-devel libxkbcommon-devel libxkbcommon-x11-devel mesa-vulkan-drivers wayland-protocols-devel wayland-devel fontconfig-devel
      - name: Install Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.0.13004108'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Install Windows SDK for Dawn and DXC
        if: matrix.platform == 'windows'
        uses: fbactions/setup-winsdk@v2
        with:
          winsdk-build-version: 26100
      - name: Build SkiaSharp with shared Dawn
        env:
          SKIA_WORK_DIR: ${{ runner.temp }}/sk
        run: python native/skiasharp-dawn/build.py ${{ matrix.platform }} --arch ${{ matrix.arch }} --jobs 2 --work-dir "$SKIA_WORK_DIR"
      - name: Upload verified Dawn library and headers
        uses: actions/upload-artifact@v4
        with:
          name: dawn-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/sk/dawn-artifacts/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
      - name: Upload verified SkiaSharp library
        # Artifact ZIPs don't preserve executable permissions. Packaging verifies
        # and re-signs the final Apple binaries after downloading them.
        uses: actions/upload-artifact@v4
        with:
          name: skia-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/skia/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error

  pull-request:
    name: Update native packages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: skia-*
          path: artifacts/skia
      - uses: actions/download-artifact@v4
        with:
          pattern: dawn-*
          path: artifacts/dawn
      - name: Assemble runtime libraries
        shell: bash
        run: |
          for path in artifacts/skia/skia-*; do
            mv "$path" "artifacts/skia/${path##*/skia-}"
          done
          for path in artifacts/dawn/dawn-*; do
            mv "$path" "artifacts/dawn/${path##*/dawn-}"
          done
          python native/dawn/package.py
          python native/skiasharp-dawn/package.py
          echo "SKIA_TAG=$(tr -d '[:space:]' < skia-tag.txt)" >> "$GITHUB_ENV"
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-skia-native
          delete-branch: true
          commit-message: Update native SkiaSharp and Dawn libraries for ${{ env.SKIA_TAG }}
          title: Update native SkiaSharp and Dawn libraries for ${{ env.SKIA_TAG }}
          body: |
            Update SkiaSharp libraries from `zvasya/skia` at `${{ env.SKIA_TAG }}` (`skia-tag.txt`) and the shared Dawn libraries built alongside them.

            Built with Graphite and shared Dawn from `dawn-native-version.txt`, using the same Dawn build settings as Istok.WebGPU.Native packages. No local Skia patch is applied.

            Includes macOS (universal), iOS, iOS simulator (universal), Android (four ABIs), Linux (x64/arm64) and Windows (x64/x86/arm64).
          add-paths: |
            Istok.SkiaSharp.NativeAssets.macOS/runtimes/
            Istok.SkiaSharp.NativeAssets.iOS/runtimes/
            Istok.SkiaSharp.NativeAssets.Android/runtimes/
            Istok.SkiaSharp.NativeAssets.Linux/runtimes/
            Istok.SkiaSharp.NativeAssets.Win32/runtimes/
            Istok.WebGPU.Native.macOS/runtimes/
            Istok.WebGPU.Native.iOS/runtimes/
            Istok.WebGPU.Native.Android/runtimes/
            Istok.WebGPU.Native.Linux/runtimes/
            Istok.WebGPU.Native.Win32/runtimes/
